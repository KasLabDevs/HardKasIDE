[package]
name = "hardkas-ide"
version = "0.2.0"
description = "HardKas IDE desktop app"
authors = ["KasLabDevs"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "hardkas_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
