name: CI

# Third-party actions are pinned to full commit SHAs (the version is in the comment next to each one).

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # The HardKas CLI the IDE drives requires exactly this release; the IDE is checked on it too.
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Version fields agree
        run: node scripts/version.mjs check
      # The project templates must compile with the SilverScript compiler the HardKas CLI installs.
      - name: Install silverc
        run: npx -y @hardkas/cli@0.13.0-rc.1 toolchain install silverc
      - name: Project templates compile
        run: node scripts/check-templates.mjs

  # The release ships Windows, macOS and Linux builds, and staging is where they differ (the bundled Node, the
  # OpenCode binary, the production dependencies). Staging and starting the app on all three for every pull request
  # catches a platform-only break before a release tag does. The full installers are built by build-desktop.yml on tags.
  desktop-stage:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Stage the desktop app
        run: pnpm --filter @hardkas-ide/desktop stage
      - name: Start the staged app and check it
        run: node apps/desktop/scripts/stage-smoke.mjs
