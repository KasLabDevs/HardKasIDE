name: Release Desktop (Windows, macOS, Linux)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name"
        required: false
        default: "v0.3.0"
  push:
    tags:
      - "v*"
      - "[0-9]+.*"

jobs:
  build-and-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            os: 'macos'
          - platform: 'ubuntu-22.04'
            os: 'linux'
          - platform: 'windows-latest'
            os: 'windows'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # stage.mjs copies this Node into the installer, and the IDE server runs the HardKas CLI with it:
      # it must be the release the CLI requires.
      - name: Setup Node.js 24.22.1
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: 'pnpm'

      # A tag pushed on a commit that still carries another version would publish mislabelled installers
      # (and, if it is the wrong commit, old code): stop here, before anything is built or uploaded.
      - name: Release tag matches the version in the code
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
        run: node scripts/version.mjs check --tag "${{ inputs.tag_name || github.ref_name }}"

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/desktop/src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile=false

      # macOS signing and notarization turn on by themselves once the repository has the secrets
      # (Settings > Secrets and variables > Actions; see docs/desktop.md, "Signing"). Without them the app is
      # built unsigned, exactly as before. Only non-empty secrets are passed on: Tauri treats an empty
      # APPLE_CERTIFICATE as a certificate to import and fails.
      - name: macOS signing (when the secrets exist)
        if: matrix.os == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          pass() { for v in "$@"; do { echo "$v<<__HK_EOF__"; printenv "$v"; echo "__HK_EOF__"; } >> "$GITHUB_ENV"; done; }
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            pass APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
            echo "macOS signing: on"
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              pass APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
              echo "macOS notarization: on"
            else
              echo "macOS notarization: off (APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID are not all set)"
            fi
          else
            echo "macOS signing: off (APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD and APPLE_SIGNING_IDENTITY are not all set): the app is unsigned"
          fi

      - name: Build and stage desktop application
        run: pnpm --filter @hardkas-ide/desktop run build

      # The website links to a fixed name (releases/latest/download/HardKas-IDE-setup.exe), so every release carries one.
      - name: Copy the Windows installer under its stable name
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $nsis = "apps/desktop/src-tauri/target/release/bundle/nsis"
          $exe = Get-ChildItem "$nsis/*-setup.exe" | Select-Object -First 1
          Copy-Item $exe.FullName "$nsis/HardKas-IDE-setup.exe"

      - name: Upload binaries to GitHub Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: HardKas IDE ${{ inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          files: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload artifact for manual download
        uses: actions/upload-artifact@v4
        with:
          name: hardkas-ide-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
