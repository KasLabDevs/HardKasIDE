name: Release Desktop (Windows, macOS, Linux)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name"
        required: false
        default: "v0.2.0"
  push:
    tags:
      - "v*"
      - "[0-9]+.*"

jobs:
  build-and-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            os: 'macos'
          - platform: 'ubuntu-22.04'
            os: 'linux'
          - platform: 'windows-latest'
            os: 'windows'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/desktop/src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build and stage desktop application
        run: pnpm --filter @hardkas-ide/desktop run build

      # The website links to a fixed name (releases/latest/download/HardKas-IDE-setup.exe), so every release carries one.
      - name: Copy the Windows installer under its stable name
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $nsis = "apps/desktop/src-tauri/target/release/bundle/nsis"
          $exe = Get-ChildItem "$nsis/*-setup.exe" | Select-Object -First 1
          Copy-Item $exe.FullName "$nsis/HardKas-IDE-setup.exe"

      - name: Upload binaries to GitHub Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: HardKas IDE ${{ inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          files: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload artifact for manual download
        uses: actions/upload-artifact@v4
        with:
          name: hardkas-ide-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
